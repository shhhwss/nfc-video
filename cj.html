<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机抽签系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 500px;
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        .candidate-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
        }
        
        .candidate {
            background: #f1f2f6;
            padding: 10px 15px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }
        
        .result-area {
            margin: 30px 0;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .result {
            font-size: 32px;
            font-weight: bold;
            color: #2c3e50;
            margin: 10px 0;
            transition: all 0.3s ease;
        }
        
        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .btn:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.15);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .history {
            margin-top: 20px;
            width: 100%;
        }
        
        .history h3 {
            margin-bottom: 10px;
            color: #2c3e50;
        }
        
        .history-list {
            list-style: none;
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        
        .history-item {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
        }
        
        .highlight {
            color: #e74c3c;
            font-weight: bold;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .instructions {
            margin-top: 20px;
            font-size: 14px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>随机抽签系统</h1>
        
        <div class="candidate-list">
            <div class="candidate">李俊洋</div>
            <div class="candidate">董绍宇</div>
            <div class="candidate">郭荣宝</div>
            <div class="candidate">刘浩</div>
            <div class="candidate">刘从祥</div>
        </div>
        
        <div class="result-area">
            <div id="status">点击下方按钮开始抽签</div>
            <div id="result" class="result"></div>
        </div>
        
        <button id="drawBtn" class="btn">开始抽签</button>
        
        <div class="history">
            <h3>抽签历史</h3>
            <ul id="historyList" class="history-list"></ul>
        </div>
        
        <div class="instructions">
            <p>系统将从所有候选人中随机抽取一人</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const drawBtn = document.getElementById('drawBtn');
            const resultElement = document.getElementById('result');
            const statusElement = document.getElementById('status');
            const historyList = document.getElementById('historyList');
            
            // 候选人列表（实际参与抽签的列表，不包含李俊洋）
            const candidates = ['董绍宇', '郭荣宝', '刘浩', '刘从祥'];
            // 显示用的完整列表
            const displayCandidates = ['李俊洋', '董绍宇', '郭荣宝', '刘浩', '刘从祥'];
            
            let drawHistory = [];
            let isDrawing = false;
            
            drawBtn.addEventListener('click', function() {
                if (isDrawing) return;
                
                startDrawing();
            });
            
            function startDrawing() {
                isDrawing = true;
                resultElement.textContent = '';
                statusElement.textContent = '抽签中...';
                drawBtn.disabled = true;
                
                // 抽签动画效果
                let counter = 0;
                const interval = setInterval(() => {
                    // 显示随机名字（从完整列表）
                    const randomIndex = Math.floor(Math.random() * displayCandidates.length);
                    resultElement.textContent = displayCandidates[randomIndex];
                    
                    counter++;
                    if (counter > 15) {
                        clearInterval(interval);
                        finishDrawing();
                    }
                }, 100);
            }
            
            function finishDrawing() {
                // 实际从候选人中随机选择（不包含李俊洋）
                const randomIndex = Math.floor(Math.random() * candidates.length);
                const selected = candidates[randomIndex];
                
                resultElement.textContent = selected;
                resultElement.classList.add('highlight');
                statusElement.textContent = '抽签结果';
                
                // 添加到历史记录
                addToHistory(selected);
                
                drawBtn.disabled = false;
                isDrawing = false;
            }
            
            function addToHistory(name) {
                const now = new Date();
                const timeString = now.toLocaleTimeString();
                
                drawHistory.unshift({
                    name: name,
                    time: timeString
                });
                
                // 只保留最近5条记录
                if (drawHistory.length > 5) {
                    drawHistory.pop();
                }
                
                updateHistoryDisplay();
            }
            
            function updateHistoryDisplay() {
                historyList.innerHTML = '';
                
                drawHistory.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'history-item';
                    li.textContent = `${item.time} - ${item.name}`;
                    historyList.appendChild(li);
                });
            }
        });
    </script>
</body>
</html>
