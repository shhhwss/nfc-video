<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幸运抽签</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 20px;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.25);
            padding: 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .candidate-list {
            margin: 20px 0;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 10px;
            font-size: 16px;
        }
        
        .result {
            margin: 30px 0;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .result-content {
            font-size: 26px;
            font-weight: bold;
            color: #2575fc;
            padding: 15px 30px;
            border-radius: 50px;
            background-color: #f0f5ff;
            display: inline-block;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s ease;
        }
        
        .result-content.show {
            opacity: 1;
            transform: scale(1);
        }
        
        .draw-btn {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(37, 117, 252, 0.4);
        }
        
        .draw-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(37, 117, 252, 0.6);
        }
        
        .draw-btn:active {
            transform: translateY(1px);
        }
        
        .draw-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .history {
            margin-top: 30px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 幸运抽签 🎉</h1>
        
        <div class="candidate-list">
            <p>候选人：李俊洋, 刘浩, 郭荣宝, 董绍宇, 刘从祥</p>
        </div>
        
        <div class="result">
            <div class="result-content" id="result">点击下方按钮开始抽签</div>
        </div>
        
        <button class="draw-btn" id="drawBtn">开始抽签</button>
        
        <div class="history">
            <p>已抽取: <span id="historyCount">0</span> 次</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const drawBtn = document.getElementById('drawBtn');
            const resultElement = document.getElementById('result');
            const historyCountElement = document.getElementById('historyCount');
            
            let historyCount = 0;
            const candidates = ['李俊洋', '刘浩', '郭荣宝', '董绍宇', '刘从祥'];
            const displayCandidates = ['刘浩', '郭荣宝', '董绍宇', '刘从祥'];
            
            drawBtn.addEventListener('click', function() {
                // 禁用按钮防止重复点击
                drawBtn.disabled = true;
                drawBtn.innerHTML = '<span class="spinner"></span> 抽签中...';
                
                // 隐藏上一次的结果
                resultElement.classList.remove('show');
                
                // 模拟抽签过程
                setTimeout(function() {
                    // 随机选择一个人
                    const randomIndex = Math.floor(Math.random() * candidates.length);
                    const selectedPerson = candidates[randomIndex];
                    
                    let displayPerson;
                    
                    // 特殊处理：如果抽到李俊洋，显示为其他随机名字
                    if (selectedPerson === '李俊洋') {
                        const randomDisplayIndex = Math.floor(Math.random() * displayCandidates.length);
                        displayPerson = displayCandidates[randomDisplayIndex];
                    } else {
                        displayPerson = selectedPerson;
                    }
                    
                    // 更新结果
                    resultElement.textContent = `恭喜: ${displayPerson}`;
                    
                    // 显示结果
                    setTimeout(function() {
                        resultElement.classList.add('show');
                        
                        // 更新抽取次数
                        historyCount++;
                        historyCountElement.textContent = historyCount;
                        
                        // 恢复按钮
                        drawBtn.disabled = false;
                        drawBtn.innerHTML = '开始抽签';
                    }, 100);
                    
                }, 1500); // 模拟抽签过程的延迟
            });
        });
    </script>
</body>
</html>
