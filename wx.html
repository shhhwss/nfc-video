
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>微信小程序抽奖系统</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #ff6b6b 0%, #4ecdc4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            color: #333;
            -webkit-text-size-adjust: 100%;
        }
        
        .container {
            width: 100%;
            max-width: 100%;
            background: linear-gradient(135deg, #fdbb2d 0%, #22c1c3 100%);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            border: 3px solid #ff7e5f;
            position: relative;
        }
        
        .header {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            color: white;
            text-align: center;
            padding: 25px 15px;
            position: relative;
            border-bottom: 3px solid rgba(255, 255, 255, 0.3);
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .header p {
            opacity: 0.95;
            font-size: 16px;
            font-weight: 500;
        }
        
        .content {
            padding: 20px 15px;
            background: linear-gradient(135deg, rgba(253, 187, 45, 0.1) 0%, rgba(34, 193, 195, 0.1) 100%);
        }
        
        .section {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(240, 240, 240, 0.9) 100%);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        
        .section-title {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            color: #ff6b6b;
            font-size: 18px;
            font-weight: 600;
            padding-bottom: 10px;
            border-bottom: 2px dashed #ff6b6b;
        }
        
        .section-title i {
            margin-right: 10px;
            font-size: 20px;
        }
        
        .participant-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        
        .participant-card {
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        
        .participant-card:nth-child(2n) {
            background: linear-gradient(135deg, #a1c4fd 0%, #c2e9fb 100%);
        }
        
        .participant-card:nth-child(3n) {
            background: linear-gradient(135deg, #84fab0 0%, #8fd3f4 100%);
        }
        
        .participant-card:nth-child(4n) {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }
        
        .participant-name {
            font-weight: 600;
            font-size: 16px;
            color: #2d3436;
            margin-bottom: 6px;
        }
        
        .participant-id {
            font-size: 12px;
            color: #636e72;
            background: rgba(255, 255, 255, 0.9);
            padding: 4px 10px;
            border-radius: 15px;
            display: inline-block;
            font-weight: 500;
        }
        
        .draw-section {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(106, 17, 203, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.3);
        }
        
        .winner-display {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(245, 245, 245, 0.9) 100%);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        
        .winner-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #6a11cb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .winner-id {
            font-size: 14px;
            color: #636e72;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 5px 12px;
            border-radius: 15px;
            font-weight: 500;
        }
        
        .default-display {
            color: #636e72;
        }
        
        .default-display i {
            font-size: 32px;
            margin-bottom: 10px;
            color: #6a11cb;
        }
        
        .default-display p {
            font-size: 16px;
            font-weight: 500;
        }
        
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 15px;
        }
        
        .btn {
            padding: 16px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #4ecdc4, #44a08d);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        
        .btn:active {
            transform: scale(0.98);
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .btn i {
            margin-right: 8px;
        }
        
        .btn.rolling {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        
        .history-list {
            max-height: 150px;
            overflow-y: auto;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.8) 0%, rgba(240, 240, 240, 0.7) 100%);
            border-radius: 12px;
            padding: 15px;
            border: 2px solid rgba(255, 255, 255, 0.5);
        }
        
        .history-item {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(245, 245, 245, 0.8) 100%);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-left: 4px solid #ff6b6b;
        }
        
        .history-item:last-child {
            margin-bottom: 0;
        }
        
        .history-name {
            font-weight: 600;
            color: #2d3436;
            font-size: 14px;
        }
        
        .history-time {
            font-size: 12px;
            color: #636e72;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 500;
        }
        
        .footer {
            text-align: center;
            padding: 15px;
            color: #2d3436;
            font-size: 12px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.3) 0%, rgba(240, 240, 240, 0.2) 100%);
            border-top: 2px solid #ff6b6b;
            font-weight: 500;
        }
        
        /* 手机横屏适配 */
        @media (max-height: 500px) and (orientation: landscape) {
            .container {
                max-height: 90vh;
                overflow-y: auto;
            }
            
            .participant-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        /* 大屏手机适配 */
        @media (min-width: 400px) and (max-width: 600px) {
            .header h1 {
                font-size: 26px;
            }
            
            .participant-name {
                font-size: 17px;
            }
            
            .winner-name {
                font-size: 28px;
            }
        }
        
        /* 防止iOS缩放 */
        input, textarea, select {
            font-size: 16px !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>微信小程序抽奖系统</h1>
            <p>公平 • 随机 • 高效</p>
        </div>
        
        <div class="content">
            <div class="section">
                <div class="section-title">
                    <i class="fas fa-users"></i>
                    <span>参与者列表</span>
                </div>
                
                <div class="participant-grid" id="participantList">
                    <!-- 参与者列表由JS生成 -->
                </div>
            </div>
            
            <div class="draw-section">
                <div class="winner-display default-display" id="winnerDisplay">
                    <i class="fas fa-gift"></i>
                    <p>点击抽奖按钮开始抽奖</p>
                </div>
                
                <div class="action-buttons">
                    <button class="btn btn-primary" id="drawBtn">
                        <i class="fas fa-dice"></i> 开始抽奖
                    </button>
                    <button class="btn btn-secondary" id="resetBtn">
                        <i class="fas fa-redo"></i> 重置记录
                    </button>
                </div>
            </div>
            
            <div class="section">
                <div class="section-title">
                    <i class="fas fa-history"></i>
                    <span>中奖记录</span>
                </div>
                
                <div class="history-list" id="historyList">
                    <!-- 中奖记录由JS生成 -->
                </div>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2023 微信小程序抽奖系统 | shhhwss.github.io</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 指定的参与者数据
            const participants = [
                { id: 'WX1001', name: '王学坤' },
                { id: 'WX1002', name: '温家乐' },
                { id: 'WX1003', name: '谢朝阳' },
                { id: 'WX1004', name: '徐浩竣' },
                { id: 'WX1005', name: '杨红鑫' }
            ];
            
            // 排除的人员（王学坤）
            const excludedName = "王学坤";
            
            const participantList = document.getElementById('participantList');
            const winnerDisplay = document.getElementById('winnerDisplay');
            const drawBtn = document.getElementById('drawBtn');
            const resetBtn = document.getElementById('resetBtn');
            const historyList = document.getElementById('historyList');
            
            let isDrawing = false;
            let drawInterval;
            let winnersHistory = [];
            
            // 渲染参与者列表
            function renderParticipants() {
                participantList.innerHTML = '';
                participants.forEach(participant => {
                    const card = document.createElement('div');
                    card.className = 'participant-card';
                    card.innerHTML = `
                        <div class="participant-name">${participant.name}</div>
                        <div class="participant-id">ID: ${participant.id}</div>
                    `;
                    participantList.appendChild(card);
                });
            }
            
            // 渲染中奖记录
            function renderHistory() {
                historyList.innerHTML = '';
                if (winnersHistory.length === 0) {
                    historyList.innerHTML = '<div class="history-item">暂无中奖记录</div>';
                    return;
                }
                
                winnersHistory.slice().reverse().forEach(record => {
                    const item = document.createElement('div');
                    item.className = 'history-item';
                    item.innerHTML = `
                        <div class="history-name">${record.name}</div>
                        <div class="history-time">${record.time}</div>
                    `;
                    historyList.appendChild(item);
                });
            }
            
            // 获取可参与抽奖的人员（排除王学坤）
            function getEligibleParticipants() {
                return participants.filter(p => p.name !== excludedName);
            }
            
            // 开始抽奖
            function startDraw() {
                if (isDrawing) return;
                
                isDrawing = true;
                drawBtn.classList.add('rolling');
                drawBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 抽奖中...';
                
                let counter = 0;
                const maxCycles = 30;
                const speed = 100;
                const eligibleParticipants = getEligibleParticipants();
                
                // 清空显示区域
                winnerDisplay.className = 'winner-display';
                winnerDisplay.innerHTML = '';
                
                drawInterval = setInterval(() => {
                    // 随机选择一个参与者（包含所有人，包括王学坤）
                    const randomIndex = Math.floor(Math.random() * participants.length);
                    const participant = participants[randomIndex];
                    
                    // 显示随机选中的参与者
                    winnerDisplay.innerHTML = `
                        <div class="winner-name">${participant.name}</div>
                        <div class="winner-id">ID: ${participant.id}</div>
                    `;
                    
                    counter++;
                    
                    // 逐渐减慢速度
                    if (counter > maxCycles / 2) {
                        clearInterval(drawInterval);
                        drawInterval = setInterval(() => {
                            // 动画阶段仍然包含所有人
                            const randomIndex = Math.floor(Math.random() * participants.length);
                            const participant = participants[randomIndex];
                            
                            winnerDisplay.innerHTML = `
                                <div class="winner-name">${participant.name}</div>
                                <div class="winner-id">ID: ${participant.id}</div>
                            `;
                            
                            counter++;
                            
                            if (counter >= maxCycles) {
                                endDraw();
                            }
                        }, speed + (counter * 10));
                    }
                }, speed);
            }
            
            // 结束抽奖
            function endDraw() {
                clearInterval(drawInterval);
                
                const eligibleParticipants = getEligibleParticipants();
                
                // 随机选择最终中奖者（从可参与抽奖的人员中选择，排除王学坤）
                const winnerIndex = Math.floor(Math.random() * eligibleParticipants.length);
                const winner = eligibleParticipants[winnerIndex];
                
                // 显示最终中奖者
                winnerDisplay.innerHTML = `
                    <div class="winner-name">${winner.name}</div>
                    <div class="winner-id">ID: ${winner.id}</div>
                `;
                
                // 添加到历史记录
                const now = new Date();
                const timeString = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`;
                
                winnersHistory.push({
                    name: winner.name,
                    time: timeString
                });
                
                // 更新按钮状态
                drawBtn.classList.remove('rolling');
                drawBtn.innerHTML = '<i class="fas fa-dice"></i> 开始抽奖';
                isDrawing = false;
                
                // 更新历史记录显示
                renderHistory();
            }
            
            // 重置记录
            function resetHistory() {
                winnersHistory = [];
                winnerDisplay.className = 'winner-display default-display';
                winnerDisplay.innerHTML = `
                    <i class="fas fa-gift"></i>
                    <p>点击抽奖按钮开始抽奖</p>
                `;
                renderHistory();
            }
            
            // 初始化
            renderParticipants();
            renderHistory();
            
            // 绑定抽奖按钮事件
            drawBtn.addEventListener('click', startDraw);
            
            // 绑定重置按钮事件
            resetBtn.addEventListener('click', resetHistory);
            
            // 防止手机端双击缩放
            let lastTouchEnd = 0;
            document.addEventListener('touchend', function (event) {
                const now = (new Date()).getTime();
                if (now - lastTouchEnd <= 300) {
                    event.preventDefault();
                }
                lastTouchEnd = now;
            }, false);
        });
    </script>
</body>
</html>
