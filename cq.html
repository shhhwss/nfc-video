
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随机抽签系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        .container {
            width: 90%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 2.2rem;
        }
        
        .description {
            color: #7f8c8d;
            margin-bottom: 30px;
            font-size: 1.1rem;
        }
        
        .lists-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin-bottom: 30px;
            gap: 20px;
        }
        
        .list-section {
            flex: 1;
            min-width: 300px;
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        h2 {
            color: #3498db;
            margin-bottom: 15px;
            font-size: 1.5rem;
        }
        
        .name-list {
            list-style: none;
            text-align: left;
        }
        
        .name-list li {
            padding: 12px 15px;
            margin: 8px 0;
            background: #f8f9fa;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .name-list li:hover {
            background: #e8f4fc;
            transform: translateX(5px);
        }
        
        .exclude-btn {
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 5px 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        .exclude-btn:hover {
            background: #c0392b;
        }
        
        .exclude-btn.excluded {
            background: #7f8c8d;
        }
        
        .controls {
            margin: 30px 0;
        }
        
        .draw-btn {
            background: #2ecc71;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }
        
        .draw-btn:hover {
            background: #27ae60;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(46, 204, 113, 0.6);
        }
        
        .draw-btn:active {
            transform: translateY(0);
        }
        
        .result-container {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .result {
            font-size: 2.5rem;
            font-weight: bold;
            color: #2c3e50;
            margin: 15px 0;
            transition: all 0.5s ease;
        }
        
        .animation-box {
            width: 100%;
            height: 80px;
            overflow: hidden;
            position: relative;
            border-radius: 10px;
            background: #f8f9fa;
            margin: 15px 0;
            display: none;
        }
        
        .animated-name {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            padding: 20px;
            color: #3498db;
        }
        
        .reset-btn {
            background: #e67e22;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.3s;
        }
        
        .reset-btn:hover {
            background: #d35400;
        }
        
        @media (max-width: 768px) {
            .lists-container {
                flex-direction: column;
            }
            
            .list-section {
                width: 100%;
            }
            
            h1 {
                font-size: 1.8rem;
            }
            
            .result {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>随机抽签系统</h1>
        <p class="description">从列表中随机抽取一名人员，可以指定排除"王学坤"或其他人员</p>
        
        <div class="lists-container">
            <div class="list-section">
                <h2>抽签列表</h2>
                <ul class="name-list" id="nameList">
                    <li>王学坤 <button class="exclude-btn" data-name="王学坤">排除</button></li>
                    <li>徐浩竣 <button class="exclude-btn" data-name="徐浩竣">排除</button></li>
                    <li>谢朝阳 <button class="exclude-btn" data-name="谢朝阳">排除</button></li>
                    <li>温佳乐 <button class="exclude-btn" data-name="温佳乐">排除</button></li>
                    <li>杨红鑫 <button class="exclude-btn" data-name="杨红鑫">排除</button></li>
                </ul>
            </div>
            
            <div class="list-section">
                <h2>已排除人员</h2>
                <ul class="name-list" id="excludedList">
                    <li class="empty">暂无排除人员</li>
                </ul>
            </div>
        </div>
        
        <div class="controls">
            <button class="draw-btn" id="drawBtn">开始抽签</button>
        </div>
        
        <div class="animation-box" id="animationBox">
            <div class="animated-name" id="animatedName"></div>
        </div>
        
        <div class="result-container">
            <h2>抽签结果</h2>
            <div class="result" id="result">等待抽签...</div>
            <button class="reset-btn" id="resetBtn">重新抽签</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const nameList = document.getElementById('nameList');
            const excludedList = document.getElementById('excludedList');
            const drawBtn = document.getElementById('drawBtn');
            const resetBtn = document.getElementById('resetBtn');
            const result = document.getElementById('result');
            const animationBox = document.getElementById('animationBox');
            const animatedName = document.getElementById('animatedName');
            
            // 初始名单
            const allNames = ['王学坤', '徐浩竣', '谢朝阳', '温佳乐', '杨红鑫'];
            let excludedNames = [];
            let availableNames = [...allNames];
            
            // 排除按钮事件
            document.querySelectorAll('.exclude-btn').forEach(button => {
                button.addEventListener('click', function() {
                    const name = this.getAttribute('data-name');
                    const listItem = this.parentElement;
                    
                    if (this.classList.contains('excluded')) {
                        // 取消排除
                        this.classList.remove('excluded');
                        this.textContent = '排除';
                        
                        // 从排除列表中移除
                        excludedNames = excludedNames.filter(n => n !== name);
                        
                        // 从排除列表中移除项目
                        const excludedItems = excludedList.querySelectorAll('li');
                        excludedItems.forEach(item => {
                            if (item.textContent.includes(name)) {
                                item.remove();
                            }
                        });
                        
                        // 如果排除列表为空，显示提示
                        if (excludedList.children.length === 0) {
                            const emptyItem = document.createElement('li');
                            emptyItem.className = 'empty';
                            emptyItem.textContent = '暂无排除人员';
                            excludedList.appendChild(emptyItem);
                        }
                    } else {
                        // 添加到排除列表
                        this.classList.add('excluded');
                        this.textContent = '取消排除';
                        
                        // 添加到排除名单
                        excludedNames.push(name);
                        
                        // 移除排除列表中的空提示
                        const emptyItem = excludedList.querySelector('.empty');
                        if (emptyItem) {
                            emptyItem.remove();
                        }
                        
                        // 添加到排除列表显示
                        const newItem = document.createElement('li');
                        newItem.textContent = name;
                        excludedList.appendChild(newItem);
                    }
                    
                    // 更新可用名单
                    availableNames = allNames.filter(name => !excludedNames.includes(name));
                });
            });
            
            // 抽签按钮事件
            drawBtn.addEventListener('click', function() {
                if (availableNames.length === 0) {
                    result.textContent = '没有可抽签的人员！';
                    return;
                }
                
                // 禁用按钮
                drawBtn.disabled = true;
                drawBtn.textContent = '抽签中...';
                
                // 显示动画
                animationBox.style.display = 'block';
                result.textContent = '抽签中...';
                
                // 随机动画效果
                let counter = 0;
                const totalIterations = 30;
                const namesCopy = [...availableNames];
                
                const shuffleInterval = setInterval(() => {
                    // 随机显示一个名字
                    const randomIndex = Math.floor(Math.random() * namesCopy.length);
                    animatedName.textContent = namesCopy[randomIndex];
                    
                    counter++;
                    if (counter >= totalIterations) {
                        clearInterval(shuffleInterval);
                        
                        // 最终结果
                        const finalIndex = Math.floor(Math.random() * availableNames.length);
                        const winner = availableNames[finalIndex];
                        
                        // 显示结果
                        setTimeout(() => {
                            animatedName.textContent = winner;
                            setTimeout(() => {
                                animationBox.style.display = 'none';
                                result.textContent = winner;
                                drawBtn.disabled = false;
                                drawBtn.textContent = '开始抽签';
                            }, 500);
                        }, 200);
                    }
                }, 100);
            });
            
            // 重置按钮事件
            resetBtn.addEventListener('click', function() {
                // 重置排除状态
                excludedNames = [];
                availableNames = [...allNames];
                
                // 重置按钮状态
                document.querySelectorAll('.exclude-btn').forEach(btn => {
                    btn.classList.remove('excluded');
                    btn.textContent = '排除';
                });
                
                // 清空排除列表
                excludedList.innerHTML = '';
                const emptyItem = document.createElement('li');
                emptyItem.className = 'empty';
                emptyItem.textContent = '暂无排除人员';
                excludedList.appendChild(emptyItem);
                
                // 重置结果显示
                result.textContent = '等待抽签...';
                animationBox.style.display = 'none';
            });
        });
    </script>
</body>
</html>
